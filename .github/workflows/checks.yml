name: Local checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tests/test_audio.py
      - run: python tests/test_resume.py
      - run: python tests/test_settings.py
      - run: python tests/test_bridge.py
      - run: python -m compileall -q custom_components
      - run: node --check custom_components/interphone_live/panel.js
